version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: leadgen_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: leadgen
      POSTGRES_PASSWORD: leadgen_dev
      POSTGRES_DB: leadgen
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadgen -d leadgen"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: leadgen_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadgen_celery
    restart: unless-stopped
    command: celery -A app.celery_app worker -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://leadgen:leadgen_dev@postgres:5432/leadgen
      REDIS_URL: redis://redis:6379/0

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadgen_beat
    restart: unless-stopped
    command: celery -A app.celery_app beat -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://leadgen:leadgen_dev@postgres:5432/leadgen
      REDIS_URL: redis://redis:6379/0

volumes:
  postgres_data:
  redis_data:
